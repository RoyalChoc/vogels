services:
  postgres:
    image: postgres:17
    container_name: vogels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vogels
      POSTGRES_USER: vogels
      POSTGRES_PASSWORD: vogels_dev
    ports:
      - "5433:5432"
    volumes:
      - vogels_postgres_data:/var/lib/postgresql/data
  webinterface:
    image: dpage/pgadmin4
    container_name: pgadmin4_web
    environment:
      PGADMIN_DEFAULT_EMAIL: kristofae@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: vogels
    ports:
      - "7001:80"
    depends_on:
      - postgres
  vogels:
    build:
      context: .
      dockerfile: Dockerfile
    image: vogels-webapp:latest
    container_name: vogels-webapp
    restart: unless-stopped
    ports:
      - "7000:5173"
    environment:
      PORT: 5173
      DATA_DIR: /data
      SEED_DIR: /seed
    volumes:
      - vogels-data:/data      

volumes:
  vogels_postgres_data:
  vogels-data:
